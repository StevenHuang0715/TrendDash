# 每 3 小時抓一次新資料並部署到 GitHub Pages
#
# 資料（SQLite 歷史資料庫 + 每日存檔）存在 data 分支，每次整個覆蓋、不留歷史，repo 才不會越來越大。
# push 程式碼到 main 時只重新建置網頁，不重新抓資料。
name: 更新資料並部署

on:
  schedule:
    - cron: "0 */3 * * *" # UTC 時間，每 3 小時一次（對應 fetchers/history.py 的 FETCH_INTERVAL_HOURS）
  workflow_dispatch: # 可以在 Actions 頁面手動執行
  push:
    branches: [main]

permissions:
  contents: write # 寫回 data 分支
  pages: write
  id-token: write

# 同一時間只跑一個，避免兩次執行同時改資料
concurrency:
  group: trenddash
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FETCH: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v7

      - name: 取回上次的資料（data 分支）
        run: |
          mkdir -p state data web/public/data
          if git fetch --depth=1 origin data; then
            git --work-tree=state checkout FETCH_HEAD -- .
            git reset -q
            if [ -f state/history.db.gz ]; then gunzip -c state/history.db.gz > data/history.db; fi
            if [ -d state/public-data ]; then cp -r state/public-data/. web/public/data/; fi
          else
            echo "還沒有 data 分支，從零開始"
          fi

      - uses: actions/setup-python@v7
        if: env.FETCH == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fetchers/requirements.txt

      - name: 抓取資料
        if: env.FETCH == 'true'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # 選用；沒設定就不顯示 YouTube
        run: |
          pip install -r fetchers/requirements.txt
          python fetchers/main.py

      - name: 存回 data 分支
        if: env.FETCH == 'true'
        run: |
          rm -rf out && mkdir out
          python -c "import sqlite3; db = sqlite3.connect('data/history.db'); db.execute('VACUUM'); db.close()"
          gzip -9 -c data/history.db > out/history.db.gz
          cp -r web/public/data out/public-data
          cd out
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "資料更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 建置網頁
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
